<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ў Складовая — Каталог</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="styles.css" />
</head>

<body>
  <div id="header"></div>
<div class="ad">
  <div class="ad_textbox">
    <p class="ad_headtext">Здесь могла быть Ваша реклама</p>
    <p class="ad_text">Но ее не будет</p>
  </div>
</div>

  <main>
<section class="catalog">
  <div class="catalog__container">
    <aside class="catalog__sidebar">
      <h2 class="catalog__sidebar-title">Фильтры</h2>

      <div class="catalog__filters">
        <div class="catalog__filter-group">
          <h3 class="catalog__filter-title">Рейтинг</h3>

          <label class="catalog__check">
            <input type="checkbox" name="rating" value="5" />
            <span>5 звёзд</span>
          </label>

          <label class="catalog__check">
            <input type="checkbox" name="rating" value="4" />
            <span>4+ звезды</span>
          </label>

          <label class="catalog__check">
            <input type="checkbox" name="rating" value="3" />
            <span>3+ звезды</span>
          </label>
        </div>

        <div class="catalog__filter-group">
          <h3 class="catalog__filter-title">Диапазон цен</h3>

          <div class="catalog__price-row">
            <label class="catalog__price-field">
              <span class="catalog__price-label">От</span>
              <input type="number" min="0" placeholder="$ 0" />
            </label>

            <span class="catalog__price-separator">-</span>

            <label class="catalog__price-field">
              <span class="catalog__price-label">До</span>
              <input type="number" min="0" placeholder="$ 100" />
            </label>
          </div>
        </div>
      </div>
    </aside>

    <div class="catalog__content">
      <div class="catalog__searchbar">
        <label class="catalog__search">
          <span class="catalog__search-icon">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input type="search" placeholder="Поиск товаров" aria-label="Поиск товаров" />
        </label>

        <div class="catalog__sort">
          <span class="catalog__sort-label">Сортировать:</span>
<select class="catalog__select" aria-label="Сортировка товаров">
  <option value="name-asc">Название (А-Я)</option>
  <option value="name-desc">Название (Я-А)</option>
  <option value="price-asc">Цена (сначала дешёвые)</option>
  <option value="price-desc">Цена (сначала дорогие)</option>
  <option value="rating-desc">Рейтинг</option>
</select>
        </div>
      </div>

      <div class="catalog__toolbar">
        <p class="catalog__count">6 товаров</p>
      </div>

      <div class="catalog__grid" id="products-grid">
        <!-- JS динамически заполняет -->
      </div>
    </div>
  </div>
</section>

<template id="product-card-template">
  <article class="product-card" data-product-card>
    <a class="product-card__media-link" data-product-link href="#">
      <div class="product-card__media">
        <img
          src="placeholder.png"
          alt=""
          class="product-card__image"
          data-product-image
        />
        <span class="product-card__badge" data-product-price>$54.99</span>
      </div>
    </a>

    <div class="product-card__body">
      <h3 class="product-card__title">
        <a class="product-card__title-link" data-product-link href="#" data-product-title>
          Переноска для животных
        </a>
      </h3>

      <div class="product-card__rating" data-product-rating>
        <div class="product-card__stars" aria-hidden="true">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-regular fa-star"></i>
        </div>
        <span class="product-card__reviews" data-product-reviews>(4.0)</span>
      </div>

      <button type="button" class="product-card__add" data-product-add-to-cart>
        В корзину
      </button>
    </div>
  </article>
</template>
    
  </main>

<div id="footer"></div>
<script src="scripts/common.js" defer></script>
<script src="scripts/layout.js" defer></script>
<script src="scripts/catalog.page.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PawsStore — Cart</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="styles.css" />
</head>

<body>
  <div id="header"></div>
  <main class="cart-page">
    <div class="cart-page__container">
      <div class="cart-page__header">
        <div>
          <h1 class="cart-page__title">Shopping Bag</h1>
          <p class="cart-page__subtitle" data-cart-count>1 item ready for checkout</p>
        </div>

        <div class="cart-page__steps" aria-label="Checkout steps">
          <span class="cart-page__step cart-page__step--active">1</span>
          <span class="cart-page__step-label">Cart</span>
          <span class="cart-page__step-separator">›</span>
          <span class="cart-page__step">2</span>
          <span class="cart-page__step-label">Checkout</span>
          <span class="cart-page__step-separator">›</span>
          <span class="cart-page__step">3</span>
          <span class="cart-page__step-label">Complete</span>
        </div>
      </div>

      <section class="cart-page__layout">
        <div class="cart-page__items-wrap">
          <div class="cart-page__items" data-cart-items></div>

          <div class="cart-page__empty" data-cart-empty hidden>
            <div class="cart-page__empty-icon">
              <i class="fa-solid fa-bag-shopping"></i>
            </div>

            <h2 class="cart-page__empty-title">Your cart is empty</h2>
            <p class="cart-page__empty-text">
              Discover amazing products for your furry friends!
            </p>

            <button type="button" class="cart-page__empty-button" data-cart-back>
              Return to catalog
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>

        <aside class="cart-page__summary" data-cart-summary>
          <div class="cart-summary">
            <div class="cart-summary__header">
              <h2 class="cart-summary__title">Order Summary</h2>
              <p class="cart-summary__subtitle" data-cart-summary-count>1 item in your bag</p>
            </div>

            <div class="cart-summary__promo">
              <label class="cart-summary__label" for="promo-code">
                <i class="fa-regular fa-ticket"></i>
                Promo Code
              </label>

              <div class="cart-summary__promo-row">
                <input
                  id="promo-code"
                  type="text"
                  class="cart-summary__input"
                  placeholder="Enter code"
                  data-promo-input
                >
                <button type="button" class="cart-summary__button" data-promo-apply>Apply</button>
              </div>

              <p class="cart-summary__message" data-promo-message></p>
            </div>

            <dl class="cart-summary__totals">
              <div class="cart-summary__row">
                <dt>Subtotal</dt>
                <dd data-cart-subtotal>$0.00</dd>
              </div>
              <div class="cart-summary__row">
                <dt>Discount</dt>
                <dd data-cart-discount>$0.00</dd>
              </div>
              <div class="cart-summary__row cart-summary__row--total">
                <dt>Total</dt>
                <dd data-cart-total>$0.00</dd>
              </div>
            </dl>

            <button type="button" class="cart-summary__checkout">
              <i class="fa-solid fa-lock"></i>
              Proceed to Checkout
            </button>

            <button type="button" class="cart-summary__back" data-cart-back>
              <i class="fa-solid fa-arrow-left"></i>
              Continue Shopping
            </button>
          </div>
        </aside>
      </section>
    </div>
  </main>

  <div id="footer"></div>

  <script src="scripts/common.js" defer></script>
  <script src="scripts/layout.js" defer></script>
  <script src="scripts/cart.page.js" defer></script>
</body>
</html>

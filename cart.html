<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ў Складовая — Корзина</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="styles.css" />
</head>

<body>
  <div id="header"></div>
  <main class="cart-page">
    <div class="cart-page_container">
      <div class="cart-page_header">
        <div>
          <h1 class="cart-page_title">Корзина</h1>
          <p class="cart-page_subtitle" data-cart-count>1 товар готов к оформлению</p>
        </div>

        <div class="cart-page_steps" aria-label="Этапы оформления">
          <span class="cart-page_step cart-page_step--active">1</span>
          <span class="cart-page_step-label">Корзина</span>
          <span class="cart-page_step-separator">›</span>
          <span class="cart-page_step">2</span>
          <span class="cart-page_step-label">Оформление</span>
          <span class="cart-page_step-separator">›</span>
          <span class="cart-page_step">3</span>
          <span class="cart-page_step-label">Готово</span>
        </div>
      </div>

      <section class="cart-page_layout">
        <div class="cart-page_items-wrap">
          <div class="cart-page_items" data-cart-items></div>

          <div class="cart-page_empty" data-cart-empty hidden>
            <div class="cart-page_empty-icon">
              <i class="fa-solid fa-bag-shopping"></i>
            </div>

            <h2 class="cart-page_empty-title">Ваша корзина пуста</h2>
            <p class="cart-page_empty-text">
              Откройте для себя удивительные товары для вашего дома!
            </p>

            <button type="button" class="cart-page_empty-button" data-cart-back>
              Вернуться в каталог
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>

        <aside class="cart-page_summary" data-cart-summary>
          <div class="cart-summary">
            <div class="cart-summary_header">
              <h2 class="cart-summary_title">Сводка заказа</h2>
              <p class="cart-summary_subtitle" data-cart-summary-count>1 товар в корзине</p>
            </div>

            <div class="cart-summary_promo">
              <label class="cart-summary_label" for="promo-code">
                <i class="fa-regular fa-ticket"></i>
                Промокод
              </label>

              <div class="cart-summary_promo-row">
                <input
                  id="promo-code"
                  type="text"
                  class="cart-summary_input"
                  placeholder="Введите код"
                  data-promo-input
                >
                <button type="button" class="cart-summary_button" data-promo-apply>Применить</button>
              </div>

              <p class="cart-summary_message" data-promo-message></p>
            </div>

            <dl class="cart-summary_totals">
              <div class="cart-summary_row">
                <dt>Подытог</dt>
                <dd data-cart-subtotal>$0.00</dd>
              </div>
              <div class="cart-summary_row">
                <dt>Скидка</dt>
                <dd data-cart-discount>$0.00</dd>
              </div>
              <div class="cart-summary_row cart-summary_row--total">
                <dt>Итого</dt>
                <dd data-cart-total>$0.00</dd>
              </div>
            </dl>

            <button type="button" class="cart-summary_checkout" data-cart-checkout>
              <i class="fa-solid fa-lock"></i>
              Перейти к оформлению
            </button>

            <button type="button" class="cart-summary_back" data-cart-back>
              <i class="fa-solid fa-arrow-left"></i>
              Продолжить покупки
            </button>
          </div>
        </aside>
      </section>
    </div>
  </main>

  <div id="footer"></div>

  <script src="scripts/common.js" defer></script>
  <script src="scripts/layout.js" defer></script>
  <script src="scripts/cart.page.js" defer></script>
</body>
</html>

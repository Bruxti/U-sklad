<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ў Складовая — Товар</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="styles.css" />
</head>

<body>
  <div id="header"></div>

  <main class="product-page">
    <div class="product-page__container">
      <nav class="product-page__breadcrumbs" aria-label="Хлебные крошки">
        <a href="catalog.html">Главная</a>
        <span>/</span>
        <a href="catalog.html">Каталог</a>
        <span>/</span>
        <span class="product-page__breadcrumbs-current" data-product-title-breadcrumb>Товар</span>
      </nav>

      <section class="product-page__layout">
        <div class="product-page__gallery">
          <div class="product-page__slider">
            <button
              type="button"
              class="product-page__slider-btn product-page__slider-btn--prev"
              data-slider-prev
              aria-label="Предыдущее изображение">
              <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="product-page__image-frame">
              <img
                src="images/placeholder_1.png"
                alt=""
                class="product-page__image"
                data-product-image>
            </div>

            <button
              type="button"
              class="product-page__slider-btn product-page__slider-btn--next"
              data-slider-next
              aria-label="Следующее изображение">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>

          <div class="product-page__thumbs" data-product-thumbs></div>
        </div>

        <div class="product-page__content">
          <div class="product-page__tags" data-product-tags></div>

          <h1 class="product-page__title" data-product-title>
            Переноска для животных
          </h1>

          <div class="product-page__rating" data-product-rating>
            <div class="product-page__stars" aria-hidden="true">
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-regular fa-star"></i>
            </div>
            <span class="product-page__rating-text">4 из 5 звёзд</span>
          </div>

          <div class="product-page__price" data-product-price>$54.99</div>

          <section class="product-page__panel product-page__panel--highlights">
            <h2 class="product-page__panel-title">Основные преимущества</h2>
            <ul class="product-page__list product-page__list--highlights" data-product-highlights></ul>
          </section>

          <section class="product-page__section">
            <h2 class="product-page__section-title">Описание</h2>
            <p class="product-page__description" data-product-description>
              Мягкая переноска для домашних животных, одобренная для использования в салоне самолёта.
            </p>
          </section>

          <section class="product-page__accordion">
            <button
              type="button"
              class="product-page__accordion-toggle"
              data-accordion-toggle
              aria-expanded="false"
              aria-controls="extended-description"
            >
              Расширенное описание
              <i class="fa-solid fa-chevron-down"></i>
            </button>

            <div
              id="extended-description"
              class="product-page__accordion-panel"
              data-accordion-panel
              hidden
            >
              <p class="product-page__accordion-text" data-full-description></p>
            </div>
          </section>

          <div class="product-page__purchase">
            <div class="product-page__quantity">
              <span class="product-page__quantity-label">Количество:</span>

              <div class="product-page__stepper" aria-label="Выбор количества">
                <button type="button" class="product-page__stepper-btn" data-quantity-minus aria-label="Уменьшить количество">
                  <i class="fa-solid fa-minus"></i>
                </button>

                <span class="product-page__stepper-value" data-quantity-value>1</span>

                <button type="button" class="product-page__stepper-btn" data-quantity-plus aria-label="Увеличить количество">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
            </div>

            <button type="button" class="product-page__cart-button" data-product-add-to-cart>
              <i class="fa-solid fa-cart-shopping"></i>
              <span>В корзину</span>
            </button>
          </div>

          <section class="product-page__panel product-page__panel--specs">
            <h2 class="product-page__panel-title product-page__panel-title--icon">
              <span class="product-page__panel-icon">
                <i class="fa-solid fa-box"></i>
              </span>
              Технические характеристики
            </h2>

            <ul class="product-page__spec-grid" data-product-specs></ul>
          </section>
        </div>
      </section>
    </div>
  </main>

  <div id="footer"></div>

  <script src="scripts/common.js" defer></script>
  <script src="scripts/layout.js" defer></script>
  <script src="scripts/product.page.js" defer></script>
</body>
</html>
